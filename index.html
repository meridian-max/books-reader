<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f6f2" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; font-src 'self' blob: data:; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; frame-src 'self' blob:; media-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Books — your quiet place</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <div id="reader" hidden></div>
    <div id="modal-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <input id="file-input" type="file" multiple hidden /><input
      id="restore-input"
      type="file"
      accept=".books,.zip"
      hidden
    />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
